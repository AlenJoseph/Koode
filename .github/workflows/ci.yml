name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koode
          POSTGRES_PASSWORD: koode
          POSTGRES_DB: koode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koode -d koode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://koode:koode@localhost:5432/koode
      SESSION_SECRET: ci-session-secret-at-least-32-chars-long
      MAGIC_LINK_DEV_MODE: 'true'
      COOKIE_SECURE: 'false'
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:3001
      BOOTSTRAP_SECRET: ci-bootstrap-secret-16
      NEXT_PUBLIC_API_URL: http://localhost:3001
      RATE_LIMIT_MAGIC_LINK_MAX: '100'


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test (unit, integration, locale parity)
        run: pnpm test

      - name: Locale parity (explicit)
        run: pnpm locale:parity

      - name: Install Playwright Chromium
        run: pnpm --filter @koode/e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3001
